name: Build CodeInjector Kivy Runner

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP if needed
        shell: bash
        run: |
          if [[ ! -f buildozer.spec ]]; then
            shopt -s nullglob
            zips=( *.zip )
            if (( ${#zips[@]} == 0 )); then
              echo "No buildozer.spec and no project ZIP found at repository root." >&2
              exit 1
            fi
            echo "Extracting ${zips[0]}..."
            unzip -o "${zips[0]}" -d . -x '.github/workflows/*'
          fi
          test -f buildozer.spec
          test -f main.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git zip unzip openjdk-17-jdk \
            autoconf automake autopoint gettext libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev libltdl-dev libsqlite3-dev libbz2-dev \
            liblzma-dev

      - name: Cache Buildozer files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ./.buildozer
          key: ${{ runner.os }}-buildozer-kivy-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-kivy-

      - name: Install Buildozer
        run: python -m pip install --upgrade pip buildozer

      - name: Compile Kivy APK
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: '1'
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeInjector-Kivy-Runner-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
